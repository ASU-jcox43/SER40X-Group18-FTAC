<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipality Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Municipality Search</h1>
        <form id="searchForm" method="POST">
            <label for="province">Select Province:</label>
            <select name="province" id="province">
                <option value="">-- All Provinces --</option>
                <option value="Ontario">Ontario</option>
                <option value="Quebec">Quebec</option>
                <option value="British Columbia">British Columbia</option>
                <option value="Alberta">Alberta</option>
            </select>

            <label for="minScore">Minimum Friendliness Score:</label>
            <input type="number" name="minScore" id="minScore" placeholder="e.g., 80" min="0" max="100">

            <button type="submit">Search</button>
        </form>

        <div id="results">
            {% if results %}
                <h2>Search Results:</h2>
                <ul>
                    {% for profile in results %}
                        <li>
                            <strong>{{ profile['City'] }}, {{ profile['Province'] }}</strong><br>
                            Score: {{ profile['Score'] }}<br>
                            Friendliness: {{ profile['Friendliness Index'] }}
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p>No results found.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
