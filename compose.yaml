services:
  backend:
    container_name: ftac-backend
    build:
      context: .
    ports:
      - 8000:8000
    volumes:
      - scrapy-output:/scrapy_output
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://ftac-mongo:27017/
    develop:
      watch:
        - action: sync
          path: ./Backend
          target: /app/Backend
  frontend:
    container_name: ftac-frontend
    image: node:20
    working_dir: /app/Frontend
    command: sh -c "npm install && npm start"
    ports:
      - 3000:3000
    volumes:
      - ./Frontend:/app/Frontend
      - frontend-node-modules:/app/Frontend/node_modules
    depends_on:
      - backend
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./Frontend:/usr/share/nginx/html
    ports:
      - 80:80
    develop:
      watch:
        - action: sync
          path: ./Frontend
          target: /usr/share/nginx/html
  mongodb:
    container_name: ftac-mongo
    image: mongo:latest
    ports:
      - 27017:27017
      - 27016:27017
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    # uncomment in order to use mongodb authentication
    #environment:
      #MONGO_INITDB_ROOT_USERNAME: "mongoadmin"
      #MONGO_INITDB_ROOT_PASSWORD: "set password here"
volumes:
  scrapy-output:
    name: "scrapy-output"
  frontend-node-modules:
    name: "frontend-node-modules"
  mongodata:
    name: "mongodata"
    driver: local
  mongoconfig:
    name: "mongoconfig"
    driver: local