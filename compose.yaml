services:
  server:
    build:
      context: .
    ports:
      - 8000:8000
    volumes:
      - scrapy-output:/scrapy_output
    depends_on:
      - mongodb

  web:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
    ports:
      - "80:80"
    develop:
      watch:
        - action: sync
          path: .
          target: /app

  mongodb:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo-data:/data/db

volumes:
  scrapy-output:
    name: "scrapy-output"
  mongo-data: