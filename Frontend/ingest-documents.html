<!doctype html>
<html lang="en">
    <head>
        <title>Pacific Trails Resort</title>
        <meta charset="utf-8"/>
    </head>
    <body>
        <h1>Ingest Documents</h1>
        <form id="crawlForm" novalidate>
            <label for="startUrl">Start URL</label>
            <input id="startUrl" name="startUrl" type="url" placeholder="https://example.ca/bylaws/..." required/><br>
            <label for="numLayers"># of layers</label>
            <input id="numLayers" name="numLayers" type="number" min="0" step="1" value="1" required/><br>
            <label class="row" for="getPdfs">
                <span>Get PDFs?</span>
                <input id="getPdfs" name="getPdfs" type="checkbox"/><br>
            </label>
            <label for="regexFilter">Regex filter (optional)</label>
            <input id="regexFilter" name="regexFilter" type="text"/><br>
            <div class="note">click Submit to post Json</div>
            <button type="submit">Submit</button>
        </form>
        <script>
            (function () {
              const form = document.getElementById('crawlForm');
              const output = document.getElementById('output');

              function show(msg) {
                output.hidden = false;
                output.textContent = msg;
              }

              function validateUrl(value) {
                try {
                  // Accepts relative URLs? user asked for "start url" so require absolute URL
                  const u = new URL(value);
                  return u.protocol === 'http:' || u.protocol === 'https:';
                } catch (e) {
                  return false;
                }
              }

              form.addEventListener('submit', async (ev) => {
                ev.preventDefault();

                const startUrl = form.startUrl.value.trim();
                const numLayersRaw = form.numLayers.value;
                const getPdfs = form.getPdfs.checked;
                const regexFilterRaw = form.regexFilter.value.trim();

                // Basic validation
                if (!startUrl) {
                  show('Error: Start URL is required.');
                  return;
                }
                if (!validateUrl(startUrl)) {
                  show('Error: Start URL must be an absolute URL starting with http:// or https://');
                  return;
                }

                const numLayers = Number(numLayersRaw);
                if (!Number.isInteger(numLayers) || numLayers < 0) {
                  show('Error: # of layers must be an integer >= 0.');
                  return;
                }

                // Attempt to validate regex (non-blocking). If invalid, warn but still send the raw string.
                let regex_valid = true;
                if (regexFilterRaw) {
                  try {
                    new RegExp(regexFilterRaw);
                  } catch (e) {
                    regex_valid = false;
                  }
                }

                const payload = {
                  start_url: startUrl,
                  num_layers: numLayers,
                  get_pdfs: Boolean(getPdfs),
                  // use null for omitted optional value to make server handling explicit
                  regex_filter: regexFilterRaw === '' ? null : regexFilterRaw
                };

                if (!regex_valid) {
                  show('Warning: regex filter appears invalid. Sending payload anyway.\n\nPayload:\n' + JSON.stringify(payload, null, 2));
                } else {
                  show('Sending payload...\n\n' + JSON.stringify(payload, null, 2));
                }

                try {
                  const res = await fetch('http://127.0.0.1:8000', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                  });

                  const contentType = res.headers.get('Content-Type') || '';
                  let bodyText;
                  if (contentType.includes('application/json')) {
                    bodyText = JSON.stringify(await res.json(), null, 2);
                  } else {
                    bodyText = await res.text();
                  }

                  show('Response: ' + res.status + ' ' + res.statusText + '\n\n' + bodyText);
                } catch (err) {
                  show('Network or CORS error while POSTing to http://127.0.0.1:8000\n\n' + String(err) + '\n\nPayload:\n' + JSON.stringify(payload, null, 2));
                }
              });
            })();
        </script>
    </body>
</html>
