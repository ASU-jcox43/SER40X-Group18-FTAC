<!doctype html>
<html lang="en">
    <head>
        <title>Download Your Reports</title>
        <meta charset="utf-8"/>
    </head>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: repeating-linear-gradient(
            to top,
            #5c7a76 0%,
            #5c7a76 100px,
            #fefaf5 0px,
            #254441 1000px
            );
        }
        h2 {
            color: #FFFFFF;
            font-family: 'Work Sans', sans-serif;
            font-weight: 500;
            text-align: center;
            background-color: #254441;
            border-radius: 10px;
        }
        button {
            background-color: #254441;
            color: #FFFFFF;
            font-family: 'Work Sans', sans-serif;
            font-weight: 500;
            font-size: 12pt;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        button:hover {
            background-color: #39524e;
            transform: translateY(2px);
        }
        button:active {
            background-color: #516E69;
        }
        input {
            font-family: 'Work Sans', sans-serif;
            font-size: 12pt;
            padding: 8px;
        }
        .hero-header {
            background-image: url("images/ftacLogo.png");
            height: 100px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        ul {
            list-style-type: none;
            font-family: 'Work Sans', sans-serif;
            font-size: 12pt;
            padding: 8px;
            background-color: #254441;
            color: white;
            max-width: 500px;
            width: 90%;
            margin: 1rem auto;
            border-radius: 5px;
        }

    </style>
    <body>
        <header class="hero-header"></header>
        <h2>Available Reports For Download</h2>
        <div style="text-align:center;">
            <input type="text" id="search" placeholder="Search reports..." />
            <button id="selectVisible">Select Visible</button>
            <button id="clearSelection">Clear</button>
            <button id="downloadSelected">Download Selected Reports</button>
        </div>
        <ul id="reportList"></ul>
        <script src="reportpost.js"></script>
    </body>
</html>
