<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bylaw Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Bar -->
    <header>
        <nav class="header-nav">
            <a href="#" onclick="showPanel('about')">About</a>
            <a href="#" onclick="showPanel('dashboard')">Dashboard</a>
            <a href="#" onclick="showPanel('municipalities')">Municipalities</a>
            <a href="#" onclick="showPanel('reports')">Reports</a>
            <a href="#" onclick="showPanel('ai')">AI Analysis</a>
            <a href="#" onclick="showPanel('scores')">Scores</a>
        </nav>
    </header>

    <!-- Dashboard page -->
    <div id="dashboardPage" class="page">
    <aside id="filterPanel">
        <h3>Filters</h3>
        <label>Business Type
        <select id="businessType">
            <option>Food Truck</option>
            <option>Cottage Food</option>
            <option>Catering</option>
        </select>
        </label>
        <label>Province
        <select id="province">
            <option>ON</option>
            <option>AB</option>
            <option>BC</option>
            <option>MB</option>
            <option>NB</option>
            <option>NL</option>
            <option>NS</option>
            <option>PE</option>
            <option>QC</option>
            <option>SK</option>
            <option>YT</option>
            <option>NT</option>
            <option>NU</option>
        </select>
        </label>
        <label>Minimum Score
        <input type="range" id="minScore" min="0" max="100">
        </label>
    </aside>

    <main id="resultsPanel">
        <table id="jurisdictionTable">
        <thead>
            <tr>
            <th>City</th>
            <th>Score</th>
            <th>Business Type</th>
            </tr>
        </thead>
        <tbody>
            <!-- populated dynamically -->
        </tbody>
        </table>
    </main>

    <aside id="detailsPanel">
        <h3>Jurisdiction Details</h3>
        <div id="detailsContent">
        <!-- AI summary, flags, score breakdown -->
        </div>
    </aside>
    </div>

</body>
</html>
