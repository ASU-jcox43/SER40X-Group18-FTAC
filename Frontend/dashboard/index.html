<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bylaw Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/ftacLogo.png" type="image/png">
</head>
<body>

    <!-- Top Bar -->
    <header>
        <nav class="header-nav">
            <img src="assets/ftacLogo.png" alt="FTAC Logo" class="nav-logo">

            <a href="#" onclick="showPanel('about')">About</a>
            <a href="#" onclick="showPanel('dashboard')">Dashboard</a>
            <a href="#" onclick="showPanel('municipalities')">Municipalities</a>
            <a href="../generate_report.html" data-external>Reports</a>
            <a href="#" onclick="showPanel('ai')">AI Analysis</a>
            <a href="#" onclick="showPanel('scores')">Scores</a>
        </nav>
    </header>

    <!-- Dashboard Page -->
    <div id="dashboardPage" class="page active">

        <!-- Left Filter Panel -->
        <aside id="filterPanel">
            <div class="panel-header">
                <span>FILTERS</span>
            </div>

            <div class="filter-item">
                <label for="businessType">Business Type</label>
                <div class="checkbox-scroll">
                    <div class="checkbox-group" id="businessType">
                        <label><input type="checkbox" value="ALL"> ALL</label>
                        <label><input type="checkbox" value="Food Truck"> Food Truck</label>
                        <label><input type="checkbox" value="Cottage Food"> Cottage Food</label>
                        <label><input type="checkbox" value="Catering"> Catering</label>
                    </div>
                </div>
            </div>
            
           <div class="filter-item">
                <label>Province</label>
                <div class="checkbox-scroll">
                    <div class="checkbox-group" id="province">
                        <label><input type="checkbox" value="ALL"> ALL</label>
                        <label><input type="checkbox" value="ON"> ON</label>
                        <label><input type="checkbox" value="AB"> AB</label>
                        <label><input type="checkbox" value="BC"> BC</label>
                        <label><input type="checkbox" value="MB"> MB</label>
                        <label><input type="checkbox" value="NB"> NB</label>
                        <label><input type="checkbox" value="NL"> NL</label>
                        <label><input type="checkbox" value="NS"> NS</label>
                        <label><input type="checkbox" value="PE"> PE</label>
                        <label><input type="checkbox" value="QC"> QC</label>
                        <label><input type="checkbox" value="SK"> SK</label>
                        <label><input type="checkbox" value="YT"> YT</label>
                        <label><input type="checkbox" value="NT"> NT</label>
                        <label><input type="checkbox" value="NU"> NU</label>
                    </div>
                </div>
            </div>


            <div class="filter-item">
                <label for="minScore">Minimum Score: <span id="minScoreValue">50</span></label>
                <input type="range" id="minScore" min="0" max="100" value="50" 
                    oninput="document.getElementById('minScoreValue')
                    .innerText = this.value">
            </div>


            <div>  
                <button class="apply-filters" onclick="applyFilters()">Apply Filters</button>
            </div>
        </aside>

        <!-- Middle Results Panel -->
        <main id="resultsPanel">
            <div class="panel-header">
                <span>MUNICIPALITY RESULTS</span>
            </div>

            <div class="results-controls">
                <label for="sortOrder">Sort by Score:</label>
                <select name="sortOrder" id="sortOrder">
                    <option value="">None</option>
                    <option value="high-to-low">High to Low</option>
                    <option value="low-to-high">Low to High</option>
                </select>
            </div>

            <div class="table-scroll">
                <table id="jurisdictionTable">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Municipality</th>
                            <th>Score</th>
                            <th>Business Type</th>
                        </tr>
                    </thead>
                    <tbody id="jurisdictionBody"></tbody>
                </table>
            </div>
        </main>

        <!-- Right Details Panel -->
        <!-- Panel Header -->
        <aside id="detailsPanel" class="hidden">
            <div class="panel-header">
                <span>DETAILS</span>
                <button class="panel-toggle" onclick="toggleDetailsPanel()">
                    <span class="arrow">▾</span>
                </button>
            </div>

            <!-- Panel Content/Body -->
            <div class="panel-content">
                <div class="detail-section">
                    <h3>
                    <span id="municipalityName"></span>,
                    <span id="municipalityProvince"></span>
                    </h3>
                </div>

                <div class="detail-section">
                    <button class="collapse-toggle" onclick="toggleSection(this)">
                        Summary <span class="arrow">▾</span>
                    </button>
                    <div class="collapse-content">
                        <p id="aiSummaryContent"></p>
                    </div>
                </div>


                <div class="detail-section">
                    <button class="collapse-toggle" onclick="toggleSection(this)">
                        Key Requirements <span class="arrow">▾</span>
                    </button>
                     <div class="collapse-content">
                        <ul id="requirementsList"></ul>
                    </div>
                </div>

                <div class="detail-section">
                    <button class="collapse-toggle" onclick="toggleSection(this)">
                        Score Breakdown <span class="arrow">▾</span>
                    </button>
                    <div class="collapse-content">
                        <ul id="scoreBreakdownList"></ul>
                    </div>
                </div>
            </div>
        </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
