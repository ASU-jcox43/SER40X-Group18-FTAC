<!doctype html>
<html lang="en">
<head>
<title>Download Your Reports</title>
<meta charset="utf-8"/>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/ftacLogo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<style>
body {
  background: repeating-linear-gradient(
    to top,
    #5c7a76 0%,
    #5c7a76 100px,
    #fefaf5 0px,
    #254441 1000px
  );
}

h2 {
  color: #FFFFFF;
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  text-align: center;
  background-color: #254441;
  border-radius: 10px 10px 0 0;
  margin: 0;
  padding: 1rem 2rem;
}

button {
  background-color: #254441;
  color: #FFFFFF;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 12pt;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

button:hover {
  background-color: #39524e;
  transform: translateY(2px);
}

button:active {
  background-color: #516E69;
}

input {
  font-family: 'Inter', sans-serif;
  font-size: 12pt;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #e2e2e2;
}

ul {
  list-style-type: none;
  font-family: 'Inter', sans-serif;
  font-size: 12pt;
  padding: 8px;
  background-color: #254441;
  color: white;
  margin: 0;
  border-radius: 0 0 10px 10px;
}

/* ── Outer page wrapper ─────────────────────────────────────── */
#reportsPage {
  display: flex;
  justify-content: center;
  padding: 1.5rem 2rem;
  min-height: calc(100vh - 100px);
}

/* ── Rounded card container ─────────────────────────────────── */
.reports-container {
  width: 100%;
  max-width: 780px;
  background-color: #fff;
  border-radius: 10px;
  box-shadow: 1px 2px 12px rgba(0, 0, 0, 0.08);
  border-bottom: 1px solid #e2e2e2;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: fit-content;
}

/* ── Controls section ───────────────────────────────────────── */
.reports-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding: 1.5rem 2rem;
  background-color: #fff;
}
</style>
<body>

<!-- Top Bar -->
<header>
  <nav class="header-nav">
    <img src="assets/ftacLogo.png" alt="FTAC Logo" class="nav-logo">
    <a href="#" onclick="showPanel('about')">About</a>
    <a href="index.html" data-external>Dashboard</a>
    <a href="#" onclick="showPanel('municipalities')">Municipalities</a>
    <a href="#" class="active-nav" onclick="showPanel('reports')">Reports</a>
    <a href="#" onclick="showPanel('ai')">AI Analysis</a>
    <a href="upload.html" data-external>Files</a>
  </nav>
</header>

<div id="reportsPage">
  <div class="reports-container">

    <h2>Available Reports For Download</h2>

    <div class="reports-controls">
      <input type="text" id="search" placeholder="Search reports..." />
      <button id="selectVisible">Select Visible</button>
      <button id="clearSelection">Clear</button>
      <button id="downloadSelected">Download Selected Reports</button>
    </div>

    <ul id="reportList"></ul>

  </div>
</div>

<script src="reportpost.js"></script>
</body>
</html>
