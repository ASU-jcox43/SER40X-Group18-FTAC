  <h2>Upload a PDF File</h2>

    <form id="uploadForm" enctype="multipart/form-data">
    <input
        type="file"
        id="pdfInput"
        name="pdfFile"
        accept="application/pdf"
        required

        Upload PDF
    </button>
    </form>
