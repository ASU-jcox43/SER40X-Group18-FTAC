<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload PDF</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/ftacLogo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Page layout ───────────────────────────────────────────── */
    #filesPage {
      display: flex;
      justify-content: center;
      padding: 1.5rem 2rem;
      min-height: calc(100vh - 100px);
    }

    /* ── Main card container ───────────────────────────────────── */
    .files-container {
      width: 100%;
      max-width: 780px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 1px 2px 12px rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid #e2e2e2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Panel header (matches dashboard panel-header) ─────────── */
    .files-container .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid #eaeaea;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      color: #fff;
      background-color: #254441;
      border-radius: 10px 10px 0 0;
    }

    /* ── Inner body padding ─────────────────────────────────────── */
    .files-body {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* ── Section label ──────────────────────────────────────────── */
    .section-label {
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.75rem;
    }

    /* ── Drag-and-drop area ─────────────────────────────────────── */
    .drop-area {
      border: 2px dashed #a8bfbd;
      border-radius: 10px;
      padding: 2.5rem 2rem;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: #666;
      background-color: #f7faf9;
      transition: background-color 0.25s, border-color 0.25s;
      cursor: pointer;
    }

    .drop-area.dragover {
      background-color: #e6efee;
      border-color: #254441;
    }

    .drop-area input[type="file"] {
      margin-top: 0.75rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
    }

    /* ── Upload controls row ────────────────────────────────────── */
    .upload-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    #fileName {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: #254441;
    }

    #uploadBtn {
      padding: 0.4rem 1.25rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      background-color: #254441;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #uploadBtn:hover:not(:disabled) {
      background-color: #1b3330;
    }

    #uploadBtn:disabled {
      background-color: #9db5b2;
      cursor: not-allowed;
    }

    /* ── Progress bar ───────────────────────────────────────────── */
    #progressContainer {
      width: 100%;
      background-color: #e8eaf0;
      border-radius: 5px;
      margin-top: 0.75rem;
      height: 18px;
      display: none;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background-color: #254441;
      border-radius: 5px;
      text-align: center;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 18px;
      transition: width 0.3s ease;
    }

    #status {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: #555;
      margin-top: 0.5rem;
    }

    /* ── Uploaded files list (single container, no per-item boxes) */
    .uploaded-section {
      padding-top: 0;
    }

    #uploadedFiles {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    #uploadedFiles li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      color: #333;
      border-top: 1px solid #eaeaea;
      transition: background-color 0.2s;
    }

    #uploadedFiles li:first-child {
      border-top: none;
    }

    #uploadedFiles li:hover {
      background-color: #f2f6f5;
    }

    #uploadedFiles li .file-name {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    #uploadedFiles li .file-icon {
      font-size: 1rem;
      color: #5c7a76;
    }

    #uploadedFiles li button {
      background: none;
      border: 1px solid #e2e2e2;
      border-radius: 6px;
      padding: 0.2rem 0.65rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: #555;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    #uploadedFiles li button:hover {
      border-color: #c0392b;
      color: #c0392b;
    }

    .empty-state {
      padding: 1.25rem;
      text-align: center;
      font-size: 0.88rem;
      color: #aaa;
      font-family: 'Inter', sans-serif;
    }

    /* ── Wrong file error  ────────────────────────────────────── */
    #status.error {
      color: #c0392b;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- ── Top Bar ───────────────────────────────────────────────── -->
  <header>
    <nav class="header-nav">
      <img src="assets/ftacLogo.png" alt="FTAC Logo" class="nav-logo">
      <a href="#" onclick="showPanel('about')">About</a>
      <a href="index.html" data-external="">Dashboard</a>
      <a href="#" onclick="showPanel('municipalities')">Municipalities</a>
      <a href="generate_report.html" data-external>Reports</a>
      <a href="#" onclick="showPanel('ai')">AI Analysis</a>
      <a href="#" class="active-nav" onclick="showPanel('files')">Files</a>
    </nav>
  </header>

  <!-- ── Page body ─────────────────────────────────────────────── -->
  <div id="filesPage">
    <div class="files-container">

      <!-- Panel header -->
      <div class="panel-header">
        File Manager
      </div>

      <div class="files-body">

        <!-- Upload section -->
        <div>
          <p class="section-label">Upload a PDF File</p>

          <div id="dropArea" class="drop-area">
            Drag &amp; drop a PDF here<br>or<br>
            <input type="file" id="pdfInput" name="pdfFile" accept="application/pdf" required>
          </div>

          <div class="upload-controls">
            <button type="button" id="uploadBtn" disabled>Upload PDF</button>
            <span id="fileName"></span>
          </div>

          <div id="progressContainer">
            <div id="progressBar">0%</div>
          </div>
          <p id="status"></p>
        </div>

        <!-- Uploaded files section -->
        <div class="uploaded-section" style="border-top: 1px solid #eaeaea; padding-top: 1.5rem;">
          <p class="section-label">Uploaded PDFs</p>
          <ul id="uploadedFiles">
            <li class="empty-state" id="emptyState">No files uploaded yet.</li>
          </ul>
        </div>

      </div><!-- /.files-body -->
    </div><!-- /.files-container -->
  </div><!-- /#filesPage -->

  <script>
    const dropArea   = document.getElementById('dropArea');
    const pdfInput   = document.getElementById('pdfInput');
    const uploadBtn  = document.getElementById('uploadBtn');
    const fileNameEl = document.getElementById('fileName');
    const fileList   = document.getElementById('uploadedFiles');
    const emptyState = document.getElementById('emptyState');

    // Enable button when file chosen via picker
    pdfInput.addEventListener('change', () => {
      if (pdfInput.files.length) {
        fileNameEl.textContent = pdfInput.files[0].name;
        uploadBtn.disabled = false;
      }
    });

    // Drag-and-drop events
    ['dragenter', 'dragover'].forEach(e => dropArea.addEventListener(e, ev => {
      ev.preventDefault(); dropArea.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(e => dropArea.addEventListener(e, ev => {
      ev.preventDefault(); dropArea.classList.remove('dragover');
    }));
    dropArea.addEventListener('drop', ev => {
      const file = ev.dataTransfer.files[0];
      if (file && file.type === 'application/pdf') {
        pdfInput.files = ev.dataTransfer.files;
        fileNameEl.textContent = file.name;
        uploadBtn.disabled = false;
      }
    });

    // Upload button — adds file to list
    uploadBtn.addEventListener('click', () => {
      const file = pdfInput.files[0];
      if (!file) return;

      // Remove empty state
      if (emptyState) emptyState.remove();

      const li = document.createElement('li');
      li.innerHTML = `
        <span class="file-name">
          <span class="file-icon">📄</span>
          ${file.name}
        </span>
        <button onclick="this.closest('li').remove(); checkEmpty()">Remove</button>
      `;
      fileList.appendChild(li);

      // Reset
      pdfInput.value = '';
      fileNameEl.textContent = '';
      uploadBtn.disabled = true;
    });

    function checkEmpty() {
      if (!fileList.querySelector('li:not(#emptyState)')) {
        const msg = document.createElement('li');
        msg.id = 'emptyState';
        msg.className = 'empty-state';
        msg.textContent = 'No files uploaded yet.';
        fileList.appendChild(msg);
      }
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
