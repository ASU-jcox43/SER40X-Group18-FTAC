<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload PDF</title>
</head>
<body>

  <h2>Upload a PDF File</h2>

  <form action="/upload" method="POST" enctype="multipart/form-data">
    <input 
      type="file" 
      name="pdfFile" 
      accept="application/pdf"
      required
    >
    
    <br><br>
    
    <button type="submit">Upload PDF</button>
  </form>

</body>
</html>
