<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload PDF</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/ftacLogo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Page layout ───────────────────────────────────────────── */
    #filesPage {
      display: flex;
      justify-content: center;
      padding: 1.5rem 2rem;
      min-height: calc(100vh - 100px);
    }

    .files-container {
      width: 100%;
      max-width: 860px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 1px 2px 12px rgba(0,0,0,0.08);
      border-bottom: 1px solid #e2e2e2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .files-container .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      color: #fff;
      background-color: #254441;
      border-radius: 10px 10px 0 0;
    }

    .files-body {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .section-label {
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.75rem;
    }

    /* ── Drop area ──────────────────────────────────────────────── */
    .drop-area {
      border: 2px dashed #a8bfbd;
      border-radius: 10px;
      padding: 2.5rem 2rem;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: #666;
      background-color: #f7faf9;
      transition: background-color 0.25s, border-color 0.25s;
      cursor: pointer;
    }

    .drop-area.dragover {
      background-color: #e6efee;
      border-color: #254441;
    }

    .drop-area input[type="file"] {
      margin-top: 0.75rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
    }

    /* ── Upload controls ────────────────────────────────────────── */
    .upload-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    #fileName {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: #254441;
    }

    #uploadBtn {
      padding: 0.4rem 1.25rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      background-color: #254441;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #uploadBtn:hover:not(:disabled) { background-color: #1b3330; }
    #uploadBtn:disabled { background-color: #9db5b2; cursor: not-allowed; }

    #progressContainer {
      width: 100%;
      background-color: #e8eaf0;
      border-radius: 5px;
      margin-top: 0.75rem;
      height: 18px;
      display: none;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background-color: #254441;
      border-radius: 5px;
      text-align: center;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 18px;
      transition: width 0.3s ease;
    }

    #status {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: #555;
      margin-top: 0.5rem;
      min-height: 1.2em;
    }

    #status.error { color: #c0392b; font-weight: 600; }

    /* ── Divider ────────────────────────────────────────────────── */
    .section-divider {
      border: none;
      border-top: 1px solid #eaeaea;
      margin: 0;
    }

    /* ════════════════════════════════════════════════════════════
       STATUS PANEL  (#224)
    ════════════════════════════════════════════════════════════ */
    .status-panel {
      background-color: #f7faf9;
      border: 1px solid #dde8e7;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
    }

    .status-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .status-panel-header .section-label { margin-bottom: 0; }

    .live-indicator {
      display: none;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      color: #2e7d6e;
      font-weight: 500;
    }

    .live-indicator.visible { display: flex; }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #2e7d6e;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    .status-empty {
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      color: #aaa;
      text-align: center;
      padding: 0.75rem 0;
    }

    #statusJobList {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .status-job {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.9rem;
      background-color: #fff;
      border: 1px solid #e4eded;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
    }

    .status-job.status-uploading  { border-left: 3px solid #f0a500; }
    .status-job.status-processing { border-left: 3px solid #2980b9; }
    .status-job.status-complete   { border-left: 3px solid #27ae60; }
    .status-job.status-failed     { border-left: 3px solid #c0392b; }

    .job-icon { font-size: 1rem; flex-shrink: 0; width: 20px; text-align: center; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #254441;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .job-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #333;
      font-weight: 500;
    }

    .job-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-uploading  { background-color: #fff4d6; color: #b07800; }
    .badge-processing { background-color: #d6eaf8; color: #1a5276; }
    .badge-complete   { background-color: #d5f5e3; color: #1e8449; }
    .badge-failed     { background-color: #fadbd8; color: #922b21; }

    .job-progress-wrap {
      width: 70px;
      height: 5px;
      background-color: #e8eaf0;
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .job-progress-bar {
      height: 100%;
      background-color: #254441;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* ════════════════════════════════════════════════════════════
       UPLOADED FILES LIST
    ════════════════════════════════════════════════════════════ */
    .uploaded-section { padding-top: 0; }

    #uploadedFiles {
      list-style: none;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    #uploadedFiles li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      color: #333;
      border-top: 1px solid #eaeaea;
      transition: background-color 0.2s;
    }

    #uploadedFiles li:first-child { border-top: none; }
    #uploadedFiles li:hover { background-color: #f2f6f5; }

    .file-name {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      min-width: 0;
    }

    .file-icon { font-size: 1rem; color: #5c7a76; flex-shrink: 0; }

    .inline-status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      margin-left: 0.6rem;
      flex-shrink: 0;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #uploadedFiles li button {
      background: none;
      border: 1px solid #e2e2e2;
      border-radius: 6px;
      padding: 0.2rem 0.65rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: #555;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    #uploadedFiles li button:hover { border-color: #c0392b; color: #c0392b; }

    .empty-state {
      padding: 1.25rem;
      text-align: center;
      font-size: 0.88rem;
      color: #aaa;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>

  <!-- ── Top Bar ───────────────────────────────────────────────── -->
  <header>
    <nav class="header-nav">
      <img src="assets/ftacLogo.png" alt="FTAC Logo" class="nav-logo">
      <a href="#" onclick="showPanel('about')">About</a>
      <a href="index.html" data-external="">Dashboard</a>
      <a href="#" onclick="showPanel('municipalities')">Municipalities</a>
      <a href="generate_report.html" data-external>Reports</a>
      <a href="#" onclick="showPanel('ai')">AI Analysis</a>
      <a href="#" class="active-nav">Files</a>
    </nav>
  </header>

  <!-- ── Page body ─────────────────────────────────────────────── -->
  <div id="filesPage">
    <div class="files-container">

      <div class="panel-header">File Manager</div>

      <div class="files-body">

        <!-- Upload section -->
        <div>
          <p class="section-label">Upload a PDF File</p>
          <div id="dropArea" class="drop-area">
            Drag &amp; drop a PDF here<br>or<br>
            <input type="file" id="pdfInput" name="pdfFile" accept="application/pdf">
          </div>
          <div class="upload-controls">
            <button type="button" id="uploadBtn" disabled>Upload &amp; Process</button>
            <span id="fileName"></span>
          </div>
          <div id="progressContainer">
            <div id="progressBar">0%</div>
          </div>
          <p id="status"></p>
        </div>

        <hr class="section-divider">

        <!-- OCR Processing Status Panel (#224) -->
        <div class="status-panel">
          <div class="status-panel-header">
            <p class="section-label">Processing Status</p>
            <div class="live-indicator" id="liveIndicator">
              <span class="live-dot"></span> Live
            </div>
          </div>
          <div id="statusEmpty" class="status-empty">No files in the pipeline yet.</div>
          <div id="statusJobList"></div>
        </div>

        <hr class="section-divider">

        <!-- Uploaded files list -->
        <div class="uploaded-section">
          <p class="section-label">Uploaded PDFs</p>
          <ul id="uploadedFiles">
            <li class="empty-state" id="emptyState">No files uploaded yet.</li>
          </ul>
        </div>

      </div><!-- /.files-body -->
    </div><!-- /.files-container -->
  </div><!-- /#filesPage -->

  <!-- script.js first (shared utilities), then upload.js (page-specific) -->
  <script src="script.js"></script>
  <script src="upload.js"></script>
</body>
</html>
